<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
  .card{background:rgba(255,255,255,.08);border-radius:24px;padding:28px 22px;max-width:360px;width:100%;border:1px solid rgba(255,255,255,.12)}
  .icon{font-size:48px;margin-bottom:10px}
  h2{font-size:19px;margin-bottom:6px}
  .sub{opacity:.72;font-size:12.5px;line-height:1.45}
  .progress{width:100%;height:10px;background:rgba(255,255,255,.12);border-radius:20px;margin:20px 0 10px;overflow:hidden}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,#00f5a0,#00d9f5);border-radius:20px;transition:width .35s ease}
  .status{font-size:12px;opacity:.75;min-height:18px}
  .steps{text-align:left;margin-top:14px;font-size:11px;opacity:.5;line-height:1.65}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>Hardware Device Lock</h2>
  <p class="sub">GPU + Canvas + Fonts + Screen + CPU. <b>IP is NOT used for identity.</b> Same phone always same ID.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Starting hardware scan...</div>
  <div class="steps" id="steps"></div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function h(s) {
  let x = 2166136261;
  s = String(s || '');
  for (let i = 0; i < s.length; i++) {
    x ^= s.charCodeAt(i);
    x = Math.imul(x, 16777619);
  }
  return (x >>> 0).toString(36);
}
function setStatus(t, p) {
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = p + '%';
}
function addStep(t) {
  document.getElementById('steps').innerHTML += '✓ ' + t + '<br>';
}

/* ===== HARDWARE ONLY - NO IP IN DEVICE ID ===== */

function getWebGL() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'w0';
    const di = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor = di ? String(gl.getParameter(di.UNMASKED_VENDOR_WEBGL) || '') : '';
    const renderer = di ? String(gl.getParameter(di.UNMASKED_RENDERER_WEBGL) || '') : '';
    const version = String(gl.getParameter(gl.VERSION) || '');
    const shading = String(gl.getParameter(gl.SHADING_LANGUAGE_VERSION) || '');
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 0;
    const maxV = gl.getParameter(gl.MAX_VERTEX_ATTRIBS) || 0;
    const maxR = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || 0;
    return vendor + '|' + renderer + '|' + version + '|' + shading + '|' + maxTex + '|' + maxV + '|' + maxR;
  } catch (e) { return 'w0'; }
}

function getCanvas() {
  try {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 60;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(10, 5, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('HW-DEVICE-LOCK', 12, 12);
    ctx.fillStyle = 'rgba(50,200,50,0.7)';
    ctx.font = '11px Times New Roman';
    ctx.fillText('AaBbCc 012345', 12, 38);
    ctx.beginPath();
    ctx.arc(200, 30, 18, 0, Math.PI * 2);
    ctx.stroke();
    return c.toDataURL();
  } catch (e) { return 'c0'; }
}

function getFonts() {
  try {
    const list = ['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact','Tahoma','Segoe UI','Roboto','Helvetica Neue','Palatino'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    span.textContent = 'mmmmmmmmmmlliWw';
    document.body.appendChild(span);
    const base = {};
    ['monospace','sans-serif','serif'].forEach(function (f) {
      span.style.fontFamily = f;
      base[f] = span.offsetWidth;
    });
    const found = [];
    list.forEach(function (font) {
      let det = false;
      ['monospace','sans-serif','serif'].forEach(function (b) {
        span.style.fontFamily = "'" + font + "'," + b;
        if (span.offsetWidth !== base[b]) det = true;
      });
      if (det) found.push(font);
    });
    document.body.removeChild(span);
    return found.join(',');
  } catch (e) { return 'f0'; }
}

function getScreen() {
  return [
    screen.width || 0,
    screen.height || 0,
    screen.availWidth || 0,
    screen.availHeight || 0,
    screen.colorDepth || 24,
    screen.pixelDepth || 24,
    window.devicePixelRatio || 1
  ].join('x');
}

function getCPU() {
  return [
    navigator.hardwareConcurrency || 0,
    navigator.deviceMemory || 0,
    navigator.maxTouchPoints || 0,
    navigator.platform || '',
    navigator.language || '',
    (navigator.languages || []).slice(0, 3).join(',')
  ].join('|');
}

function getTZ() {
  try {
    return Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  } catch (e) { return ''; }
}

function getTG() {
  try {
    return String(tg.platform || '') + '|' + String(tg.version || '');
  } catch (e) { return ''; }
}

async function run() {
  const t0 = Date.now();
  try {
    setStatus('Reading GPU / WebGL...', 12);
    await new Promise(function (r) { setTimeout(r, 800); });
    const webgl = getWebGL();
    addStep('GPU / WebGL renderer');

    setStatus('Canvas rendering signature...', 26);
    await new Promise(function (r) { setTimeout(r, 800); });
    const canvas = getCanvas();
    addStep('Canvas signature');

    setStatus('Installed fonts...', 40);
    await new Promise(function (r) { setTimeout(r, 750); });
    const fonts = getFonts();
    addStep('Font set');

    setStatus('Screen hardware...', 54);
    await new Promise(function (r) { setTimeout(r, 650); });
    const scr = getScreen();
    addStep('Screen metrics');

    setStatus('CPU / Memory / Touch...', 68);
    await new Promise(function (r) { setTimeout(r, 650); });
    const cpu = getCPU();
    addStep('CPU + Memory');

    setStatus('Timezone + client...', 82);
    await new Promise(function (r) { setTimeout(r, 600); });
    const tz = getTZ();
    const tgs = getTG();
    addStep('Timezone + Telegram');

    setStatus('Building hardware ID...', 92);
    await new Promise(function (r) { setTimeout(r, 500); });

    // *** DEVICE ID = HARDWARE ONLY ***
    // IP is intentionally NOT included
    // Changing IP will NOT change this ID
    const raw = [
      webgl,
      h(canvas),
      fonts,
      scr,
      cpu,
      tz,
      tgs
    ].join('||');

    const fp = 'hw_' + h(raw);

    const elapsed = Date.now() - t0;
    if (elapsed < 7800) {
      setStatus('Locking device...', 97);
      await new Promise(function (r) { setTimeout(r, 7800 - elapsed); });
    }

    setStatus('Hardware ID locked!', 100);
    addStep('ID ready (no IP)');
    await new Promise(function (r) { setTimeout(r, 400); });

    tg.sendData(fp);
  } catch (err) {
    setStatus('Completing...', 98);
    const fb = 'hw_' + h([
      String(screen.width || 0),
      String(screen.height || 0),
      String(navigator.hardwareConcurrency || 0),
      String(navigator.platform || ''),
      String(navigator.language || ''),
      String(window.devicePixelRatio || 1)
    ].join('|'));
    setTimeout(function () { try { tg.sendData(fb); } catch (e) {} }, 300);
  }
}

setTimeout(function () {
  const st = document.getElementById('status');
  if (st && st.textContent.indexOf('locked') === -1) {
    try {
      tg.sendData('hw_' + h([
        String(screen.width || 0),
        String(screen.height || 0),
        String(navigator.hardwareConcurrency || 0),
        String(navigator.platform || '')
      ].join('|')));
    } catch (e) {}
  }
}, 12000);

setTimeout(run, 400);
</script>
</body>
</html>
