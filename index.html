<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Verifying Device...</h2>
  <p style="color:#94a3b8; font-size:14px;">Please wait a moment</p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    async function generateStrongFingerprint() {
      const components = [];

      components.push(navigator.userAgent || "");
      components.push(navigator.language || "");
      components.push(navigator.platform || "");
      components.push(navigator.hardwareConcurrency || 0);
      components.push(screen.width + "x" + screen.height);
      components.push(screen.colorDepth || 0);
      components.push(new Date().getTimezoneOffset());

      // Canvas Fingerprint
      try {
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 200;
        canvas.height = 50;
        ctx.textBaseline = "top";
        ctx.font = "14px Arial";
        ctx.fillStyle = "#f60";
        ctx.fillRect(10, 10, 100, 30);
        ctx.fillStyle = "#069";
        ctx.fillText("DeviceCheck-2026", 15, 15);
        components.push(canvas.toDataURL());
      } catch (e) {
        components.push("canvas_error");
      }

      // WebGL Fingerprint
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (gl) {
          const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
          if (debugInfo) {
            components.push(gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || "");
            components.push(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "");
          }
        }
      } catch (e) {
        components.push("webgl_error");
      }

      // Audio
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        components.push(audioCtx.sampleRate.toString());
        audioCtx.close();
      } catch (e) {
        components.push("audio_error");
      }

      const raw = components.join("|||");
      const msgBuffer = new TextEncoder().encode(raw);
      const hashBuffer = await crypto.subtle.digest("SHA-256", msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

      return "hw_" + hashHex.substring(0, 32);
    }

    async function sendFingerprint() {
      try {
        const fingerprint = await generateStrongFingerprint();
        tg.sendData(fingerprint);
        setTimeout(() => tg.close(), 700);
      } catch (err) {
        tg.sendData("hw_error_" + Date.now());
        setTimeout(() => tg.close(), 700);
      }
    }

    sendFingerprint();
  </script>
</body>
</html>
