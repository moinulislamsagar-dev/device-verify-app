<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #e2e8f0);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 360px;
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 16px; padding: 28px 22px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .shield { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; }
    .status { font-size: 0.95rem; min-height: 1.4em; margin-top: 12px; opacity: 0.95; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .spinner {
      width: 48px; height: 48px; margin: 10px auto 6px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #38bdf8; border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots {
      0% { content: ""; } 25% { content: "."; }
      50% { content: ".."; } 75% { content: "..."; }
    }
    #turnstile-box { margin: 10px 0 4px; display: flex; justify-content: center; min-height: 65px; }
    .hidden { display: none !important; }
    .btn {
      display: none;
      width: 100%;
      margin-top: 18px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
    }
    .btn.show { display: block; }
    .btn:active { transform: scale(0.98); }
    .btn.err-btn { background: #f87171; color: #450a0a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>Device Verification</h1>
    <div id="spinner" class="spinner"></div>
    <div id="turnstile-box"></div>
    <div class="status" id="status"><span class="dots">Please wait</span></div>
    <button type="button" class="btn" id="returnBtn">✅ Return to Bot</button>
  </div>
  <script>
(function () {
  var TURNSTILE_SITE_KEY = "0x4AAAAAAFiBGOmolKjRxNrs";

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
  }

  var statusEl = document.getElementById("status");
  var spinner = document.getElementById("spinner");
  var turnstileBox = document.getElementById("turnstile-box");
  var returnBtn = document.getElementById("returnBtn");
  var payloadToSend = "";
  var sent = false;

  function setStatus(text, cls) {
    statusEl.className = "status" + (cls ? " " + cls : "");
    statusEl.innerHTML = text;
  }

  function getTelegramUserId() {
    try {
      if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        return String(tg.initDataUnsafe.user.id);
      }
    } catch (e) {}
    return "0";
  }

  function localFingerprint() {
    var parts = [];
    try {
      parts.push(navigator.userAgent || "");
      parts.push(navigator.language || "");
      parts.push(String(screen.width) + "x" + String(screen.height) + "x" + String(screen.colorDepth || 0));
      parts.push(String(window.devicePixelRatio || 1));
      parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || "");
      parts.push(String(navigator.hardwareConcurrency || 0));
      parts.push(navigator.platform || "");
      parts.push(String(navigator.maxTouchPoints || 0));
    } catch (e) {}
    try {
      var c = document.createElement("canvas");
      c.width = 240; c.height = 60;
      var ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillStyle = "#f60";
      ctx.fillRect(0, 0, 240, 60);
      ctx.fillStyle = "#069";
      ctx.fillText("IZ-device-fp", 6, 8);
      parts.push(c.toDataURL().slice(-96));
    } catch (e) {}
    try {
      var canvas = document.createElement("canvas");
      var gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
      if (gl) {
        var dbg = gl.getExtension("WEBGL_debug_renderer_info");
        if (dbg) {
          parts.push(String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || ""));
          parts.push(String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || ""));
        }
      }
    } catch (e) {}
    var h = 2166136261;
    var str = parts.join("|");
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return "lf_" + (h >>> 0).toString(16);
  }

  function loadFingerprint() {
    return new Promise(function (resolve) {
      var done = false;
      function finish(id) {
        if (done) return;
        done = true;
        resolve((id && String(id).length > 4) ? String(id) : localFingerprint());
      }
      try {
        var s = document.createElement("script");
        s.src = "https://openfpcdn.io/fingerprintjs/v4/iife.min.js";
        s.async = true;
        s.onload = function () {
          try {
            FingerprintJS.load()
              .then(function (fp) { return fp.get(); })
              .then(function (r) { finish(r && r.visitorId ? r.visitorId : ""); })
              .catch(function () { finish(""); });
          } catch (e) { finish(""); }
        };
        s.onerror = function () { finish(""); };
        document.head.appendChild(s);
        setTimeout(function () { finish(""); }, 4500);
      } catch (e) {
        finish("");
      }
    });
  }

  function fetchPublicIp() {
    return new Promise(function (resolve) {
      var done = false;
      function finish(ip) {
        if (done) return;
        done = true;
        resolve(ip || "unknown");
      }
      var timer = setTimeout(function () { finish("unknown"); }, 3500);
      try {
        fetch("https://api.ipify.org?format=json")
          .then(function (r) { return r.json(); })
          .then(function (j) {
            clearTimeout(timer);
            finish((j && j.ip) ? String(j.ip) : "unknown");
          })
          .catch(function () {
            clearTimeout(timer);
            try {
              fetch("https://api64.ipify.org?format=json")
                .then(function (r) { return r.json(); })
                .then(function (j) { finish((j && j.ip) ? String(j.ip) : "unknown"); })
                .catch(function () { finish("unknown"); });
            } catch (e2) {
              finish("unknown");
            }
          });
      } catch (e) {
        clearTimeout(timer);
        finish("unknown");
      }
    });
  }

  function getTurnstileToken() {
    return new Promise(function (resolve) {
      if (!TURNSTILE_SITE_KEY) {
        resolve("skip");
        return;
      }
      var tries = 0;
      function start() {
        if (typeof turnstile === "undefined") {
          tries++;
          if (tries > 50) {
            resolve("");
            return;
          }
          setTimeout(start, 120);
          return;
        }
        try {
          turnstile.render(turnstileBox, {
            sitekey: TURNSTILE_SITE_KEY,
            size: "compact",
            callback: function (token) {
              resolve(token || "");
            },
            "error-callback": function () {
              resolve("");
            },
            "expired-callback": function () {
              resolve("");
            }
          });
        } catch (e) {
          resolve("");
        }
      }
      start();
    });
  }

  function sendPayload() {
    if (sent) return;
    if (!payloadToSend) return;
    sent = true;
    try {
      if (tg && typeof tg.sendData === "function") {
        tg.sendData(String(payloadToSend));
        return;
      }
    } catch (e) {}
    setStatus("Open this from the Telegram bot.", "err");
    sent = false;
  }

  returnBtn.addEventListener("click", function () {
    sendPayload();
  });

  function showReturn(ok) {
    spinner.classList.add("hidden");
    try { turnstileBox.classList.add("hidden"); } catch (e) {}
    returnBtn.classList.add("show");
    if (!ok) {
      returnBtn.classList.add("err-btn");
      returnBtn.textContent = "↩️ Return to Bot";
    } else {
      returnBtn.classList.remove("err-btn");
      returnBtn.textContent = "✅ Return to Bot";
    }
  }

  async function run() {
    setStatus('<span class="dots">Please wait</span>');

    var fpP = loadFingerprint();
    var ipP = fetchPublicIp();
    var tsP = getTurnstileToken();

    var fp = await fpP;
    var ip = await ipP;
    var turnstileToken = await tsP;

    if (!fp || String(fp).length < 4) {
      payloadToSend = "fail|fp|0";
      setStatus("Device check failed.", "err");
      showReturn(false);
      return;
    }

    if (!turnstileToken || String(turnstileToken).length < 8) {
      payloadToSend = "fail|turnstile|0";
      setStatus("Security check failed. Try again.", "err");
      showReturn(false);
      return;
    }

    var uid = getTelegramUserId();
    var exp = Math.floor(Date.now() / 1000) + 900;
    payloadToSend = "ok|" + uid + "|" + fp + "|" + ip + "|" + exp + "|manual";

    setStatus("Verified ✓\nTap Return to continue.", "ok");
    showReturn(true);
  }

  run().catch(function () {
    payloadToSend = "fail|error|0";
    setStatus("Error. Tap Return.", "err");
    showReturn(false);
  });
})();
  </script>
</body>
</html>
