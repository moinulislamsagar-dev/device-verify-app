<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Check</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
  .card{background:rgba(255,255,255,.08);border-radius:24px;padding:28px 22px;max-width:360px;width:100%;border:1px solid rgba(255,255,255,.12)}
  .icon{font-size:48px;margin-bottom:10px}
  h2{font-size:19px;margin-bottom:6px}
  .sub{opacity:.72;font-size:12.5px;line-height:1.45}
  .progress{width:100%;height:10px;background:rgba(255,255,255,.12);border-radius:20px;margin:20px 0 10px;overflow:hidden}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,#00f5a0,#00d9f5);border-radius:20px;transition:width .35s ease}
  .status{font-size:12px;opacity:.75;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>Security Verification</h2>
  <p class="sub">Please wait while we verify your device. Do not close this screen.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Starting…</div>
</div>
<script>
const tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch (e) {}

var START_MS = Date.now();
var MIN_MS = 8000;
var sent = false;

function h(s) {
  var x = 2166136261;
  s = String(s || '');
  for (var i = 0; i < s.length; i++) {
    x ^= s.charCodeAt(i);
    x = Math.imul(x, 16777619);
  }
  return (x >>> 0).toString(36);
}

function setStatus(t, p) {
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = Math.min(100, p) + '%';
}

function sleep(ms) {
  return new Promise(function (r) { setTimeout(r, ms); });
}

/* Wait until Telegram injects initData / user (can be delayed after ready()) */
async function waitTelegramSession(maxMs) {
  var t0 = Date.now();
  while (Date.now() - t0 < maxMs) {
    try {
      var initStr = String(tg.initData || '');
      var user = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : null;
      if (initStr.length > 10 || (user && user.id)) {
        return true;
      }
    } catch (e) {}
    await sleep(150);
  }
  return false;
}

function getTG() {
  try {
    var u = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};
    var initStr = String(tg.initData || '');
    var authDate = (tg.initDataUnsafe && tg.initDataUnsafe.auth_date) ? String(tg.initDataUnsafe.auth_date) : '';
    // init=1 if signed string OR at least Telegram user object present (WebApp context)
    var hasInit = (initStr.length > 10) ? 1 : ((u && u.id) ? 1 : 0);
    return {
      id: u.id ? String(u.id) : '',
      platform: String(tg.platform || ''),
      hasInit: hasInit,
      authDate: authDate
    };
  } catch (e) {
    return { id: '', platform: '', hasInit: 0, authDate: '' };
  }
}

function getWebGL() {
  try {
    var c = document.createElement('canvas');
    var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return { raw: 'w0', vendor: '', renderer: '' };
    var di = gl.getExtension('WEBGL_debug_renderer_info');
    var vendor = di ? String(gl.getParameter(di.UNMASKED_VENDOR_WEBGL) || '') : '';
    var renderer = di ? String(gl.getParameter(di.UNMASKED_RENDERER_WEBGL) || '') : '';
    var version = String(gl.getParameter(gl.VERSION) || '');
    var shading = String(gl.getParameter(gl.SHADING_LANGUAGE_VERSION) || '');
    var maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 0;
    var maxV = gl.getParameter(gl.MAX_VERTEX_ATTRIBS) || 0;
    var maxR = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || 0;
    return {
      raw: [vendor, renderer, version, shading, maxTex, maxV, maxR].join('|'),
      vendor: vendor,
      renderer: renderer
    };
  } catch (e) {
    return { raw: 'w0', vendor: '', renderer: '' };
  }
}

function getCanvas() {
  try {
    var c = document.createElement('canvas');
    c.width = 240; c.height = 60;
    var ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(10, 5, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('SEC-CHECK', 12, 12);
    ctx.fillStyle = 'rgba(50,200,50,0.7)';
    ctx.font = '11px Times New Roman';
    ctx.fillText('AaBbCc 012345', 12, 38);
    ctx.beginPath();
    ctx.arc(200, 30, 18, 0, Math.PI * 2);
    ctx.stroke();
    return c.toDataURL();
  } catch (e) { return 'c0'; }
}

function getFonts() {
  try {
    var list = ['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact','Tahoma','Segoe UI','Roboto','Helvetica Neue','Palatino'];
    var span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    span.textContent = 'mmmmmmmmmmlliWw';
    document.body.appendChild(span);
    var base = {};
    ['monospace','sans-serif','serif'].forEach(function (f) {
      span.style.fontFamily = f;
      base[f] = span.offsetWidth;
    });
    var found = [];
    list.forEach(function (font) {
      var det = false;
      ['monospace','sans-serif','serif'].forEach(function (b) {
        span.style.fontFamily = "'" + font + "'," + b;
        if (span.offsetWidth !== base[b]) det = true;
      });
      if (det) found.push(font);
    });
    document.body.removeChild(span);
    return found.join(',');
  } catch (e) { return 'f0'; }
}

function getScreen() {
  return [screen.width||0, screen.height||0, screen.availWidth||0, screen.availHeight||0, screen.colorDepth||24, window.devicePixelRatio||1].join('x');
}

function getCPU() {
  return [
    navigator.hardwareConcurrency||0,
    navigator.deviceMemory||0,
    navigator.maxTouchPoints||0,
    navigator.platform||'',
    navigator.language||'',
    (navigator.languages||[]).slice(0,3).join(',')
  ].join('|');
}

function getTZ() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch (e) { return ''; }
}

function isEmulator(renderer, vendor) {
  var r = (renderer + ' ' + vendor).toLowerCase();
  var bad = ['swiftshader', 'llvmpipe', 'virtualbox', 'vmware svga', 'microsoft basic render driver', 'softgl', 'mesa offscreen', 'android emulator'];
  for (var i = 0; i < bad.length; i++) {
    if (r.indexOf(bad[i]) !== -1) return true;
  }
  return false;
}

async function getNetInfo() {
  var ip = '0';
  var vpn = false;
  try {
    var ctrl = new AbortController();
    setTimeout(function () { ctrl.abort(); }, 4500);
    var r = await fetch('https://api.ipify.org?format=json', { signal: ctrl.signal });
    var d = await r.json();
    if (d && d.ip) ip = String(d.ip);
  } catch (e) {
    try {
      var r2 = await fetch('https://api64.ipify.org?format=json');
      var d2 = await r2.json();
      if (d2 && d2.ip) ip = String(d2.ip);
    } catch (e2) {}
  }
  if (!ip || ip === '0') return { ip: '0', vpn: false };

  try {
    var ctrlA = new AbortController();
    setTimeout(function () { ctrlA.abort(); }, 4500);
    var ra = await fetch('https://proxycheck.io/v2/' + encodeURIComponent(ip) + '?vpn=1&asn=1', { signal: ctrlA.signal });
    var da = await ra.json();
    var node = da && da[ip] ? da[ip] : null;
    if (node) {
      var proxy = String(node.proxy || '').toLowerCase();
      var type = String(node.type || '').toLowerCase();
      if (proxy === 'yes' && (type.indexOf('vpn') !== -1 || type.indexOf('socks') !== -1 || type === 'vpn')) {
        vpn = true;
      }
    }
  } catch (eA) {}

  if (!vpn) {
    try {
      var ctrlB = new AbortController();
      setTimeout(function () { ctrlB.abort(); }, 4500);
      var rb = await fetch('https://ipwho.is/' + encodeURIComponent(ip), { signal: ctrlB.signal });
      var db = await rb.json();
      if (db && db.success !== false && db.security) {
        if (db.security.vpn === true || db.security.proxy === true || db.security.tor === true) {
          vpn = true;
        }
      }
    } catch (eB) {}
  }
  return { ip: ip, vpn: vpn };
}

async function waitMinTime() {
  var left = MIN_MS - (Date.now() - START_MS);
  if (left > 0) await sleep(left);
}

function sendPayload(payload) {
  if (sent) return;
  sent = true;
  setStatus('Done', 100);
  setTimeout(function () { try { tg.sendData(payload); } catch (e) {} }, 300);
}

async function run() {
  try {
    setStatus('Connecting…', 8);
    await waitTelegramSession(2500);

    setStatus('Checking environment…', 18);
    await sleep(500);
    var webgl = getWebGL();
    if (isEmulator(webgl.renderer, webgl.vendor)) {
      await waitMinTime();
      sendPayload('ban_emu|t0=' + START_MS + '|init=0');
      return;
    }

    setStatus('Device signals…', 32);
    await sleep(600);
    var canvas = getCanvas();

    setStatus('System profile…', 45);
    await sleep(600);
    var fonts = getFonts();
    var scr = getScreen();
    var cpu = getCPU();

    setStatus('Telegram session…', 58);
    await sleep(400);
    await waitTelegramSession(1500);
    var tgInfo = getTG();

    setStatus('Network check…', 72);
    await sleep(400);
    var net = await getNetInfo();

    setStatus('Finalizing…', 90);
    await sleep(400);

    var raw = [webgl.raw, h(canvas), fonts, scr, cpu, getTZ(), tgInfo.platform].join('||');
    var fpHash = h(raw);
    var payload = 'hw_' + fpHash;
    if (tgInfo.id) payload += '|uid=' + tgInfo.id;
    payload += '|ip=' + (net.ip || '0');
    payload += '|init=' + (tgInfo.hasInit ? '1' : '0');
    if (tgInfo.authDate) payload += '|ad=' + tgInfo.authDate;
    payload += '|vpn=' + (net.vpn ? '1' : '0');
    payload += '|t0=' + START_MS;

    await waitMinTime();
    sendPayload(payload);
  } catch (err) {
    await waitTelegramSession(1000);
    var tgInfo = getTG();
    var fb = 'hw_' + h([String(screen.width||0), String(screen.height||0), String(navigator.hardwareConcurrency||0), String(navigator.platform||''), String(window.devicePixelRatio||1)].join('|'));
    if (tgInfo.id) fb += '|uid=' + tgInfo.id;
    fb += '|ip=0|init=' + (tgInfo.hasInit ? '1' : '0') + '|vpn=0|t0=' + START_MS;
    await waitMinTime();
    sendPayload(fb);
  }
}

setTimeout(function () {
  if (sent) return;
  var tgInfo = getTG();
  var fb = 'hw_' + h(String(screen.width)+'x'+String(screen.height)+'x'+String(navigator.hardwareConcurrency||0)+'x'+String(START_MS));
  if (tgInfo.id) fb += '|uid=' + tgInfo.id;
  fb += '|ip=0|init=' + (tgInfo.hasInit ? '1' : '0') + '|vpn=0|t0=' + START_MS;
  waitMinTime().then(function () { sendPayload(fb); });
}, 17000);

setTimeout(run, 200);
</script>
</body>
</html>
