<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #e2e8f0);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 360px;
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 16px; padding: 28px 22px; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .shield { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.9rem; opacity: 0.85; line-height: 1.45; margin-bottom: 18px; }
    .status { font-size: 0.85rem; min-height: 1.4em; margin-top: 12px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .hint { margin-top: 16px; font-size: 0.75rem; opacity: 0.5; }
    .spinner {
      width: 48px; height: 48px; margin: 8px auto 4px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #38bdf8; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dots::after { content: ""; animation: dots 1.4s steps(4, end) infinite; }
    @keyframes dots {
      0% { content: ""; } 25% { content: "."; }
      50% { content: ".."; } 75% { content: "..."; }
    }
    #turnstile-box { margin: 8px 0; display: flex; justify-content: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>Device Verification</h1>
    <p id="msg">Checking your device securely</p>
    <div id="spinner" class="spinner"></div>
    <div id="turnstile-box" class="hidden"></div>
    <div class="status" id="status"><span class="dots">Please wait</span></div>
    <div class="hint">Do not close this window</div>
  </div>
  <script>
(function () {
  var WORKER_URL = "https://iz-device-verify.moinul-islam-sagar.workers.dev/verify";
  var TURNSTILE_SITE_KEY = "0x4AAAAAAFiBGOmolKjRxNrs";
  var MIN_WAIT_MS = 8500;

  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
  }

  var statusEl = document.getElementById("status");
  var msgEl = document.getElementById("msg");
  var spinner = document.getElementById("spinner");
  var turnstileBox = document.getElementById("turnstile-box");

  function setStatus(text, cls) {
    statusEl.className = "status" + (cls ? " " + cls : "");
    statusEl.innerHTML = text;
  }
  function wait(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  /** Strict: must get real initData (inline / menu launch only) */
  function getInitData() {
    try {
      if (tg && tg.initData && String(tg.initData).length > 30) {
        return String(tg.initData);
      }
    } catch (e) {}
    try {
      var hash = (window.location.hash || "").replace(/^#/, "");
      var params = new URLSearchParams(hash);
      var fromHash = params.get("tgWebAppData");
      if (fromHash && fromHash.length > 30) return fromHash;
    } catch (e) {}
    try {
      var q = new URLSearchParams(window.location.search || "");
      var fromQ = q.get("tgWebAppData");
      if (fromQ && fromQ.length > 30) return fromQ;
    } catch (e) {}
    return "";
  }

  function getPlatform() {
    try { if (tg && tg.platform) return String(tg.platform); } catch (e) {}
    return "";
  }

  function loadFingerprint() {
    return new Promise(function (resolve) {
      var done = false;
      function finish(id) {
        if (done) return;
        done = true;
        resolve(id || localFallback());
      }
      var s = document.createElement("script");
      s.src = "https://openfpcdn.io/fingerprintjs/v4/iife.min.js";
      s.async = true;
      s.onload = function () {
        try {
          FingerprintJS.load().then(function (fp) { return fp.get(); })
            .then(function (r) { finish(r && r.visitorId ? String(r.visitorId) : ""); })
            .catch(function () { finish(""); });
        } catch (e) { finish(""); }
      };
      s.onerror = function () { finish(""); };
      document.head.appendChild(s);
      setTimeout(function () { finish(""); }, 5000);
    });
  }

  function localFallback() {
    var parts = [];
    try {
      parts.push(navigator.userAgent || "", navigator.language || "");
      parts.push(String(screen.width) + "x" + String(screen.height));
      parts.push(String(window.devicePixelRatio || 1));
      parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || "");
      parts.push(String(navigator.hardwareConcurrency || 0), navigator.platform || "");
    } catch (e) {}
    try {
      var c = document.createElement("canvas");
      c.width = 200; c.height = 50;
      var ctx = c.getContext("2d");
      ctx.textBaseline = "top"; ctx.font = "14px Arial";
      ctx.fillStyle = "#f60"; ctx.fillRect(0, 0, 200, 50);
      ctx.fillStyle = "#069"; ctx.fillText("IZ-fp", 4, 4);
      parts.push(c.toDataURL().slice(-64));
    } catch (e) {}
    var h = 2166136261, str = parts.join("|");
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16);
  }

  function getTurnstileToken() {
    return new Promise(function (resolve) {
      if (!TURNSTILE_SITE_KEY) { resolve(""); return; }
      var tries = 0;
      function start() {
        if (typeof turnstile === "undefined") {
          tries++;
          if (tries > 40) { resolve(""); return; }
          setTimeout(start, 150);
          return;
        }
        turnstileBox.classList.remove("hidden");
        try {
          turnstile.render(turnstileBox, {
            sitekey: TURNSTILE_SITE_KEY,
            size: "compact",
            callback: function (token) {
              turnstileBox.classList.add("hidden");
              resolve(token || "");
            },
            "error-callback": function () {
              turnstileBox.classList.add("hidden");
              resolve("");
            },
            "expired-callback": function () { resolve(""); }
          });
        } catch (e) {
          turnstileBox.classList.add("hidden");
          resolve("");
        }
      }
      start();
    });
  }

  async function run() {
    msgEl.textContent = "Checking your device securely";
    setStatus('<span class="dots">Please wait</span>');

    // Must have initData (inline button). Retry briefly while waiting.
    var initData = getInitData();
    var waitP = wait(MIN_WAIT_MS);
    var fpP = loadFingerprint();
    var tsP = getTurnstileToken();

    var fp = await fpP;
    var turnstileToken = await tsP;
    await waitP;

    if (!initData || initData.length < 30) {
      for (var i = 0; i < 15; i++) {
        await wait(200);
        try { if (tg) tg.ready(); } catch (e) {}
        initData = getInitData();
        if (initData && initData.length > 30) break;
      }
    }

    if (!initData || initData.length < 30) {
      spinner.classList.add("hidden");
      setStatus("Wrong open method", "err");
      msgEl.textContent = "Open Verify only from the button under the bot message (inline). Reply-keyboard cannot provide Telegram signature.";
      return;
    }

    setStatus('<span class="dots">Almost done</span>');

    var result = null;
    try {
      var res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          initData: initData,
          fingerprint: fp,
          platform: getPlatform(),
          turnstileToken: turnstileToken || ""
        })
      });
      result = await res.json();
    } catch (e) {
      spinner.classList.add("hidden");
      setStatus("Network error", "err");
      msgEl.textContent = "Could not reach server. Try again.";
      return;
    }

    spinner.classList.add("hidden");

    if (result && result.ok) {
      setStatus("Verified ✓", "ok");
      msgEl.textContent = "Device verified. Return to the bot and tap ✅ I finished verification.";
      // Try sendData if available (usually not on inline)
      try {
        if (tg && typeof tg.sendData === "function" && result.token) {
          tg.sendData(result.token);
        }
      } catch (e) {}
      return;
    }

    var reason = (result && result.reason) || "failed";
    var detail = (result && result.detail) || "";

    if (reason === "vpn") {
      setStatus("VPN detected", "err");
      msgEl.textContent = "Turn off VPN / proxy and try again.";
    } else if (reason === "multi_device" || reason === "multi_ip") {
      setStatus("Not allowed", "err");
      msgEl.textContent = "This device or network is already linked to another account.";
    } else if (reason === "init_data") {
      setStatus("Telegram check failed", "err");
      if (detail === "bad_hash") {
        msgEl.textContent = "Bot token mismatch on server. Admin must set correct BOT_TOKEN.";
      } else if (detail === "missing_use_inline_button") {
        msgEl.textContent = "Open only from the inline Verify button under the message.";
      } else {
        msgEl.textContent = "Telegram signature invalid (" + detail + "). Try again.";
      }
    } else if (reason === "turnstile") {
      setStatus("Check failed", "err");
      msgEl.textContent = "Human check failed. Try again.";
    } else if (reason === "misconfigured") {
      setStatus("Server config", "err");
      msgEl.textContent = "Server secrets missing. Admin: set BOT_TOKEN + RESULT_SECRET.";
    } else {
      setStatus("Failed", "err");
      msgEl.textContent = "Verification failed. Please try again.";
    }
  }

  run().catch(function () {
    spinner.classList.add("hidden");
    setStatus("Error", "err");
    msgEl.textContent = "Unexpected error. Try again.";
  });
})();
  </script>
</body>
</html>
