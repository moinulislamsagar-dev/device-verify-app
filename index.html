<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--tg-theme-bg-color, #0f172a);
      color: var(--tg-theme-text-color, #e2e8f0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--tg-theme-secondary-bg-color, #1e293b);
      border-radius: 16px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    .shield { font-size: 48px; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 0.9rem; opacity: 0.85; line-height: 1.45; margin-bottom: 18px; }
    .bar-wrap {
      height: 8px;
      background: rgba(255,255,255,.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 99px;
      transition: width 0.2s linear;
    }
    .status { font-size: 0.85rem; min-height: 1.4em; opacity: 0.9; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    .hint { margin-top: 16px; font-size: 0.75rem; opacity: 0.55; }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>Device Verification</h1>
    <p id="msg">Security check in progress. Please wait…</p>
    <div class="bar-wrap"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Starting…</div>
    <div class="hint">Do not close this window</div>
  </div>
  <script>
(function () {
  var WORKER_URL = "https://iz-device-verify.moinul-islam-sagar.workers.dev/verify";
  var MIN_WAIT_MS = 8000;

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
  }

  var t0 = Date.now();
  var bar = document.getElementById("bar");
  var statusEl = document.getElementById("status");
  var msgEl = document.getElementById("msg");

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function progressUntil(ms) {
    return new Promise(function (resolve) {
      var start = Date.now();
      function tick() {
        var elapsed = Date.now() - start;
        var pct = Math.min(100, Math.floor((elapsed / ms) * 100));
        bar.style.width = pct + "%";
        var left = Math.max(0, Math.ceil((ms - elapsed) / 1000));
        setStatus("Checking… " + left + "s");
        if (elapsed >= ms) {
          bar.style.width = "100%";
          resolve();
        } else {
          requestAnimationFrame(tick);
        }
      }
      tick();
    });
  }

  function simpleHash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16);
  }

  function collectFingerprint() {
    var parts = [];
    try {
      parts.push(navigator.userAgent || "");
      parts.push(navigator.language || "");
      parts.push(String(screen.width) + "x" + String(screen.height) + "x" + String(screen.colorDepth || ""));
      parts.push(String(window.devicePixelRatio || 1));
      parts.push(Intl.DateTimeFormat().resolvedOptions().timeZone || "");
      parts.push(String(navigator.hardwareConcurrency || 0));
      parts.push(String(navigator.maxTouchPoints || 0));
      parts.push(navigator.platform || "");
    } catch (e) {}
    try {
      var c = document.createElement("canvas");
      c.width = 200;
      c.height = 50;
      var ctx = c.getContext("2d");
      ctx.textBaseline = "top";
      ctx.font = "14px Arial";
      ctx.fillStyle = "#f60";
      ctx.fillRect(0, 0, 200, 50);
      ctx.fillStyle = "#069";
      ctx.fillText("IZ-verify-fp", 4, 4);
      parts.push(c.toDataURL().slice(-80));
    } catch (e) {
      parts.push("no-canvas");
    }
    try {
      var c2 = document.createElement("canvas");
      var gl = c2.getContext("webgl") || c2.getContext("experimental-webgl");
      if (gl) {
        var dbg = gl.getExtension("WEBGL_debug_renderer_info");
        if (dbg) {
          parts.push(String(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) || ""));
          parts.push(String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || ""));
        }
      }
    } catch (e) {
      parts.push("no-webgl");
    }
    return simpleHash(parts.join("|"));
  }

  function getInitData() {
    if (!tg) return "";
    try {
      if (tg.initData && String(tg.initData).length > 10) return String(tg.initData);
    } catch (e) {}
    return "";
  }

  function getPlatform() {
    try {
      if (tg && tg.platform) return String(tg.platform);
    } catch (e) {}
    return "";
  }

  function sendToBot(payload) {
    if (tg && typeof tg.sendData === "function") {
      try {
        tg.sendData(payload);
        return true;
      } catch (e) {
        return false;
      }
    }
    return false;
  }

  async function run() {
    setStatus("Preparing…");
    msgEl.textContent = "Security check in progress. Please wait…";
    await progressUntil(MIN_WAIT_MS);

    setStatus("Collecting device data…");
    var fp = collectFingerprint();
    var initData = getInitData();
    var platform = getPlatform();

    if (!initData && tg) {
      for (var i = 0; i < 10; i++) {
        await new Promise(function (r) { setTimeout(r, 150); });
        initData = getInitData();
        if (initData) break;
      }
    }

    setStatus("Verifying with server…");
    bar.style.width = "100%";

    var body = {
      initData: initData,
      fingerprint: fp,
      t0: t0,
      platform: platform
    };

    var result = null;
    try {
      var res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      result = await res.json();
    } catch (e) {
      setStatus("Network error", "err");
      msgEl.textContent = "Could not reach verification server. Try again.";
      sendToBot("fail|network|" + String(e && e.message || "err").slice(0, 80));
      return;
    }

    if (result && result.ok && result.token) {
      setStatus("Verified ✓", "ok");
      msgEl.textContent = "Device verified successfully.";
      sendToBot(result.token);
      try {
        if (tg) setTimeout(function () { tg.close(); }, 600);
      } catch (e) {}
      return;
    }

    var reason = (result && result.reason) || "failed";
    var ban = !!(result && result.ban);
    var detail = (result && result.detail) || "";

    if (reason === "too_fast") {
      setStatus("Too fast — blocked", "err");
      msgEl.textContent = "Verification was submitted too quickly.";
    } else if (reason === "vpn") {
      setStatus("VPN detected", "err");
      msgEl.textContent = "Please turn off VPN / proxy and try again.";
    } else if (reason === "multi_device" || reason === "multi_ip") {
      setStatus("Already registered", "err");
      msgEl.textContent = "This device or network is already linked to another account.";
    } else if (reason === "init_data") {
      setStatus("Open from Telegram", "err");
      msgEl.textContent = "Open Verify from the bot button inside Telegram.";
    } else {
      setStatus("Failed", "err");
      msgEl.textContent = "Verification failed. Please try again.";
    }

    sendToBot("fail|" + reason + "|" + (ban ? "1" : "0") + "|" + String(detail).slice(0, 60));
  }

  run().catch(function (e) {
    setStatus("Error", "err");
    msgEl.textContent = "Unexpected error. Close and try again.";
    sendToBot("fail|client_error|0|" + String(e && e.message || "err").slice(0, 60));
  });
})();
  </script>
</body>
</html>
