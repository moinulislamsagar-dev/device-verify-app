<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.07);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 360px;
    width: 100%;
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .icon { font-size: 52px; margin-bottom: 12px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
  .sub { opacity: 0.75; font-size: 13px; line-height: 1.5; margin-bottom: 8px; }
  .progress {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.12);
    border-radius: 20px;
    margin: 22px 0 12px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f5a0, #00d9f5);
    border-radius: 20px;
    transition: width 0.4s ease;
  }
  .status { font-size: 12px; opacity: 0.7; min-height: 18px; letter-spacing: 0.3px; }
  .steps { text-align: left; margin-top: 18px; font-size: 11px; opacity: 0.55; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>Hardware Security Check</h2>
  <p class="sub">Deep device analysis to allow only 1 account per device. Please wait ~8 seconds.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Starting security scan...</div>
  <div class="steps" id="steps"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function h(s) {
  let x = 0;
  for (let i = 0; i < s.length; i++) {
    x = ((x << 5) - x) + s.charCodeAt(i);
    x |= 0;
  }
  return Math.abs(x).toString(36);
}

function setStatus(t, p) {
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = p + '%';
}

function addStep(t) {
  const el = document.getElementById('steps');
  el.innerHTML += '✓ ' + t + '<br>';
}

function canvasFP() {
  try {
    const c = document.createElement('canvas');
    c.width = 280; c.height = 80;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f60';
    ctx.fillRect(20, 10, 120, 40);
    ctx.fillStyle = '#069';
    ctx.font = '16px Arial';
    ctx.fillText('HW-SEC-2026@Flexi', 5, 25);
    ctx.fillStyle = 'rgba(50,200,50,0.8)';
    ctx.font = '12px Times';
    ctx.fillText(navigator.userAgent.slice(0, 40), 5, 55);
    ctx.beginPath();
    ctx.arc(200, 40, 25, 0, Math.PI * 2);
    ctx.stroke();
    return h(c.toDataURL());
  } catch(e) { return 'c0'; }
}

function webglFP() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'w0';
    const di = gl.getExtension('WEBGL_debug_renderer_info');
    const v = di ? gl.getParameter(di.UNMASKED_VENDOR_WEBGL) : 'nv';
    const r = di ? gl.getParameter(di.UNMASKED_RENDERER_WEBGL) : 'nr';
    const params = [
      gl.getParameter(gl.VERSION),
      gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
      gl.getParameter(gl.MAX_TEXTURE_SIZE),
      gl.getParameter(gl.MAX_VERTEX_ATTRIBS)
    ].join('|');
    return h(v + '|' + r + '|' + params);
  } catch(e) { return 'w0'; }
}

function audioFP() {
  return new Promise(resolve => {
    const to = setTimeout(() => resolve('a0'), 1200);
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { clearTimeout(to); resolve('a0'); return; }
      const ctx = new AC();
      const osc = ctx.createOscillator();
      const an = ctx.createAnalyser();
      const gn = ctx.createGain();
      gn.gain.value = 0.0001;
      osc.type = 'sawtooth';
      osc.frequency.value = 10000;
      osc.connect(an);
      an.connect(gn);
      gn.connect(ctx.destination);
      osc.start(0);
      setTimeout(() => {
        try {
          const d = new Float32Array(an.frequencyBinCount);
          an.getFloatFrequencyData(d);
          let s = 0;
          for (let i = 0; i < 40; i++) s += Math.abs(d[i] || 0);
          osc.stop();
          ctx.close();
          clearTimeout(to);
          resolve(h(String(s) + d.slice(0, 15).join(',')));
        } catch(e) { clearTimeout(to); resolve('a0'); }
      }, 150);
    } catch(e) { clearTimeout(to); resolve('a0'); }
  });
}

function fontsFP() {
  try {
    const list = ['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact','Trebuchet MS','Palatino','Garamond','Bookman','Arial Black'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    span.textContent = 'mmmmmmmmmmlli';
    document.body.appendChild(span);
    const base = {};
    ['monospace','sans-serif','serif'].forEach(f => {
      span.style.fontFamily = f;
      base[f] = span.offsetWidth;
    });
    const found = [];
    list.forEach(font => {
      let ok = false;
      ['monospace','sans-serif','serif'].forEach(b => {
        span.style.fontFamily = "'" + font + "'," + b;
        if (span.offsetWidth !== base[b]) ok = true;
      });
      if (ok) found.push(font);
    });
    document.body.removeChild(span);
    return h(found.join(','));
  } catch(e) { return 'f0'; }
}

async function ipFP() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch('https://api.ipify.org?format=json', { signal: ctrl.signal });
    const d = await r.json();
    return d.ip || '0.0.0.0';
  } catch(e) { return '0.0.0.0'; }
}

function tgIntegrity() {
  try {
    const u = tg.initDataUnsafe || {};
    const platform = String(tg.platform || '');
    const version = String(tg.version || '');
    const color = String(tg.colorScheme || '');
    const hasUser = !!(u.user && u.user.id);
    const hasAuth = !!(tg.initData && tg.initData.length > 10);
    // Cloned / fake apps often miss initData or have weird platform
    const official = ['android','ios','tdesktop','web','weba','macos','android_x','unigram'].indexOf(platform) >= 0;
    return {
      platform, version, color, hasUser, hasAuth, official,
      uid: hasUser ? u.user.id : 0
    };
  } catch(e) {
    return { platform: 'x', version: '', color: '', hasUser: false, hasAuth: false, official: false, uid: 0 };
  }
}

async function run() {
  const start = Date.now();
  try {
    setStatus('Scanning canvas signature...', 8);
    await new Promise(r => setTimeout(r, 700));
    const canvas = canvasFP();
    addStep('Canvas fingerprint');

    setStatus('Analyzing GPU / WebGL...', 18);
    await new Promise(r => setTimeout(r, 700));
    const webgl = webglFP();
    addStep('GPU / WebGL');

    setStatus('Checking audio hardware...', 30);
    await new Promise(r => setTimeout(r, 600));
    const audio = await audioFP();
    addStep('Audio context');

    setStatus('Detecting installed fonts...', 42);
    await new Promise(r => setTimeout(r, 700));
    const fonts = fontsFP();
    addStep('Font signature');

    setStatus('Reading screen & hardware...', 55);
    await new Promise(r => setTimeout(r, 700));
    const screenS = (screen.width||0) + 'x' + (screen.height||0) + 'x' + (screen.colorDepth||24) + 'x' + (window.devicePixelRatio||1);
    const cores = navigator.hardwareConcurrency || 0;
    const mem = navigator.deviceMemory || 0;
    const touch = navigator.maxTouchPoints || 0;
    const lang = navigator.language || '';
    const plat = navigator.platform || '';
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
    addStep('Screen + CPU + Memory');

    setStatus('Verifying network / IP...', 68);
    await new Promise(r => setTimeout(r, 600));
    const ip = await ipFP();
    addStep('IP address');

    setStatus('Checking real Telegram client...', 80);
    await new Promise(r => setTimeout(r, 800));
    const tgi = tgIntegrity();
    addStep('Telegram integrity');

    setStatus('Building hardware identity...', 90);
    await new Promise(r => setTimeout(r, 600));

    // Combined strong fingerprint (hardware primary, IP secondary)
    const raw = [
      canvas, webgl, audio, fonts,
      screenS, String(cores), String(mem), String(touch),
      lang, plat, tz,
      tgi.platform, tgi.version, String(tgi.hasAuth), String(tgi.official)
    ].join('||');

    const mainHash = h(raw);
    const extra = h(canvas + webgl + audio + fonts).slice(0, 10);
    const fp = 'hw_' + mainHash + '_' + extra;

    // Ensure minimum ~8 seconds total
    const elapsed = Date.now() - start;
    if (elapsed < 7800) {
      setStatus('Finalizing security check...', 96);
      await new Promise(r => setTimeout(r, 7800 - elapsed));
    }

    setStatus('Verification complete!', 100);
    addStep('Identity locked');
    await new Promise(r => setTimeout(r, 400));
    tg.sendData(fp);
  } catch (err) {
    setStatus('Recovering...', 95);
    const fb = 'hw_' + h(
      String(Date.now()) + '|' +
      (screen.width||0) + 'x' + (screen.height||0) + '|' +
      (navigator.language||'') + '|' +
      (navigator.platform||'') + '|' +
      (navigator.hardwareConcurrency||0)
    );
    setTimeout(() => tg.sendData(fb), 500);
  }
}

// Hard timeout 12s
setTimeout(() => {
  const st = document.getElementById('status');
  if (st && st.textContent !== 'Verification complete!') {
    st.textContent = 'Completing...';
    try {
      tg.sendData('hw_' + h(String(Date.now()) + '|' + (screen.width||0)));
    } catch(e) {}
  }
}, 12000);

setTimeout(run, 400);
</script>
</body>
</html>
