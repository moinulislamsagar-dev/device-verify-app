<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.07);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 360px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .icon { font-size: 52px; margin-bottom: 12px; }
  h2 { margin: 0 0 8px; font-size: 20px; }
  .sub { opacity: 0.75; font-size: 13px; line-height: 1.5; }
  .progress {
    width: 100%; height: 10px;
    background: rgba(255,255,255,0.12);
    border-radius: 20px; margin: 22px 0 12px; overflow: hidden;
  }
  .bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00f5a0, #00d9f5);
    border-radius: 20px; transition: width 0.4s ease;
  }
  .status { font-size: 12px; opacity: 0.7; min-height: 18px; }
  .steps { text-align: left; margin-top: 16px; font-size: 11px; opacity: 0.55; line-height: 1.7; }
  .fail { color: #ff6b6b; font-size: 14px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">🛡️</div>
  <h2 id="title">Hardware Security Check</h2>
  <p class="sub" id="sub">Deep device analysis (~8 sec). Only 1 account per device allowed.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Starting...</div>
  <div class="steps" id="steps"></div>
  <div class="fail" id="fail"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function h(s) {
  let x = 0;
  for (let i = 0; i < String(s).length; i++) {
    x = ((x << 5) - x) + String(s).charCodeAt(i);
    x |= 0;
  }
  return Math.abs(x).toString(36);
}

function setStatus(t, p) {
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = p + '%';
}
function addStep(t) {
  document.getElementById('steps').innerHTML += '✓ ' + t + '<br>';
}

function canvasFP() {
  try {
    const c = document.createElement('canvas');
    c.width = 280; c.height = 80;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#f60';
    ctx.fillRect(20, 10, 120, 40);
    ctx.fillStyle = '#069';
    ctx.font = '16px Arial';
    ctx.fillText('HW-SEC-2026', 5, 25);
    ctx.fillStyle = 'rgba(50,200,50,0.8)';
    ctx.font = '12px Times';
    ctx.fillText((navigator.userAgent || '').slice(0, 36), 5, 55);
    return h(c.toDataURL());
  } catch(e) { return 'c0'; }
}

function webglFP() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'w0';
    const di = gl.getExtension('WEBGL_debug_renderer_info');
    const v = di ? gl.getParameter(di.UNMASKED_VENDOR_WEBGL) : 'nv';
    const r = di ? gl.getParameter(di.UNMASKED_RENDERER_WEBGL) : 'nr';
    return h(v + '|' + r + '|' + gl.getParameter(gl.VERSION));
  } catch(e) { return 'w0'; }
}

function audioFP() {
  return new Promise(resolve => {
    const to = setTimeout(() => resolve('a0'), 1000);
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { clearTimeout(to); resolve('a0'); return; }
      const ctx = new AC();
      const osc = ctx.createOscillator();
      const an = ctx.createAnalyser();
      const gn = ctx.createGain();
      gn.gain.value = 0.0001;
      osc.type = 'sawtooth';
      osc.connect(an); an.connect(gn); gn.connect(ctx.destination);
      osc.start(0);
      setTimeout(() => {
        try {
          const d = new Float32Array(an.frequencyBinCount);
          an.getFloatFrequencyData(d);
          let s = 0;
          for (let i = 0; i < 30; i++) s += Math.abs(d[i] || 0);
          osc.stop(); ctx.close();
          clearTimeout(to);
          resolve(h(String(Math.round(s * 100)) + d.slice(0, 8).join(',')));
        } catch(e) { clearTimeout(to); resolve('a0'); }
      }, 120);
    } catch(e) { clearTimeout(to); resolve('a0'); }
  });
}

function fontsFP() {
  try {
    const list = ['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    span.textContent = 'mmmmmmmmmmlli';
    document.body.appendChild(span);
    const base = {};
    ['monospace','sans-serif','serif'].forEach(f => {
      span.style.fontFamily = f;
      base[f] = span.offsetWidth;
    });
    const found = [];
    list.forEach(font => {
      let ok = false;
      ['monospace','sans-serif','serif'].forEach(b => {
        span.style.fontFamily = font + ',' + b;
        if (span.offsetWidth !== base[b]) ok = true;
      });
      if (ok) found.push(font);
    });
    document.body.removeChild(span);
    return h(found.join(','));
  } catch(e) { return 'f0'; }
}

async function ipFP() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch('https://api.ipify.org?format=json', { signal: ctrl.signal });
    const d = await r.json();
    return d.ip || '0';
  } catch(e) { return '0'; }
}

function tgCheck() {
  try {
    const u = tg.initDataUnsafe || {};
    const platform = String(tg.platform || '');
    const version = String(tg.version || '');
    const hasUser = !!(u.user && u.user.id);
    const hasAuth = !!(tg.initData && String(tg.initData).length > 20);
    const official = ['android','ios','tdesktop','web','weba','macos','android_x','unigram'].indexOf(platform) >= 0;
    return { platform, version, hasUser, hasAuth, official, uid: hasUser ? u.user.id : 0 };
  } catch(e) {
    return { platform: 'x', version: '', hasUser: false, hasAuth: false, official: false, uid: 0 };
  }
}

function showBan(msg) {
  document.getElementById('icon').textContent = '⛔';
  document.getElementById('title').textContent = 'Access Denied';
  document.getElementById('sub').textContent = '';
  document.getElementById('status').textContent = '';
  document.getElementById('bar').style.width = '100%';
  document.getElementById('bar').style.background = '#ff6b6b';
  document.getElementById('fail').style.display = 'block';
  document.getElementById('fail').textContent = msg;
  // Send ban result to bot
  setTimeout(function() {
    try { tg.sendData('ban_multi'); } catch(e) {}
  }, 1500);
}

async function run() {
  const start = Date.now();
  try {
    setStatus('Scanning canvas...', 10);
    await new Promise(r => setTimeout(r, 700));
    const canvas = canvasFP();
    addStep('Canvas');

    setStatus('Analyzing GPU...', 22);
    await new Promise(r => setTimeout(r, 700));
    const webgl = webglFP();
    addStep('GPU / WebGL');

    setStatus('Checking audio hardware...', 35);
    await new Promise(r => setTimeout(r, 600));
    const audio = await audioFP();
    addStep('Audio');

    setStatus('Detecting fonts...', 48);
    await new Promise(r => setTimeout(r, 700));
    const fonts = fontsFP();
    addStep('Fonts');

    setStatus('Reading hardware...', 60);
    await new Promise(r => setTimeout(r, 700));
    const screenS = (screen.width||0) + 'x' + (screen.height||0) + 'x' + (screen.colorDepth||24);
    const cores = navigator.hardwareConcurrency || 0;
    const mem = navigator.deviceMemory || 0;
    const touch = navigator.maxTouchPoints || 0;
    const lang = navigator.language || '';
    const plat = navigator.platform || '';
    let tz = '';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
    addStep('Screen + CPU');

    setStatus('Checking network...', 72);
    await new Promise(r => setTimeout(r, 600));
    const ip = await ipFP();
    addStep('IP');

    setStatus('Checking real Telegram...', 85);
    await new Promise(r => setTimeout(r, 800));
    const tgi = tgCheck();
    addStep('Telegram client');

    // --- LOCAL REVIEW (inside mini-app) ---
    // Fake / cloned client detection
    if (!tgi.hasUser || !tgi.hasAuth) {
      showBan('Fake or incomplete Telegram client detected.');
      return;
    }
    if (!tgi.official) {
      // Soft warning only - some clients are ok, still send ok with mark
      // Strict mode: uncomment next 2 lines to ban unknown platforms
      // showBan('Unofficial / cloned Telegram app detected.');
      // return;
    }

    setStatus('Building identity...', 92);
    await new Promise(r => setTimeout(r, 500));

    // Stable fingerprint (same device = same id)
    const stable = [
      webgl, fonts, screenS,
      String(cores), String(mem), String(touch),
      lang, plat, tz,
      tgi.platform, String(tgi.official)
    ].join('||');
    const secondary = canvas.slice(0, 8) + '|' + audio.slice(0, 6);
    const fp = 'ok_' + h(stable) + '_' + h(secondary).slice(0, 8);

    const elapsed = Date.now() - start;
    if (elapsed < 7800) {
      setStatus('Finalizing...', 96);
      await new Promise(r => setTimeout(r, 7800 - elapsed));
    }

    setStatus('Verified!', 100);
    addStep('Identity locked');
    await new Promise(r => setTimeout(r, 400));

    // Only send simple result to bot
    tg.sendData(fp);
  } catch (err) {
    setStatus('Finishing...', 95);
    const fb = 'ok_' + h(String(screen.width) + '|' + String(navigator.language) + '|' + String(navigator.hardwareConcurrency));
    setTimeout(function() { try { tg.sendData(fb); } catch(e) {} }, 400);
  }
}

setTimeout(function() {
  const st = document.getElementById('status');
  if (st && st.textContent !== 'Verified!') {
    try {
      tg.sendData('ok_' + h(String(Date.now()).slice(-6) + '|' + String(screen.width)));
    } catch(e) {}
  }
}, 12000);

setTimeout(run, 400);
</script>
</body>
</html>
