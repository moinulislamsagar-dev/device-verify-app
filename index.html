<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 30px 25px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  h2 { margin: 0 0 10px; font-size: 22px; }
  p { opacity: 0.8; font-size: 14px; line-height: 1.5; }
  .progress {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    margin: 25px 0 15px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    border-radius: 10px;
    transition: width 0.3s;
  }
  .status { font-size: 13px; opacity: 0.7; min-height: 20px; }
  .icon { font-size: 48px; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>Device Security Check</h2>
  <p>Verifying your device to prevent multi-accounting. This takes a few seconds.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Initializing...</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function hashString(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash).toString(36);
}

function getCanvasFP() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 240; canvas.height = 60;
    const ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(10, 10, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('DeviceVerify@2026', 2, 15);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('FlexiFlash', 4, 35);
    return hashString(canvas.toDataURL());
  } catch(e) { return 'c0'; }
}

function getWebGLFP() {
  try {
    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return 'w0';
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor = debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : '';
    const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : '';
    return hashString(vendor + '|' + renderer);
  } catch(e) { return 'w0'; }
}

function getAudioFP() {
  return new Promise((resolve) => {
    const timeout = setTimeout(() => resolve('a0'), 800);
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) { clearTimeout(timeout); resolve('a0'); return; }
      const ctx = new AudioCtx();
      const oscillator = ctx.createOscillator();
      const analyser = ctx.createAnalyser();
      const gain = ctx.createGain();
      gain.gain.value = 0;
      oscillator.type = 'triangle';
      oscillator.connect(analyser);
      analyser.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(0);
      setTimeout(() => {
        try {
          const data = new Float32Array(analyser.frequencyBinCount);
          analyser.getFloatFrequencyData(data);
          oscillator.stop();
          ctx.close();
          clearTimeout(timeout);
          resolve(hashString(data.slice(0, 20).join(',')));
        } catch(e) {
          clearTimeout(timeout);
          resolve('a0');
        }
      }, 100);
    } catch(e) {
      clearTimeout(timeout);
      resolve('a0');
    }
  });
}

function getFontsFP() {
  try {
    const fonts = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia', 'Comic Sans MS', 'Impact'];
    const test = document.createElement('span');
    test.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    test.innerHTML = 'mmmmmmmmmmlli';
    document.body.appendChild(test);
    const defaultWidth = {};
    ['monospace', 'sans-serif', 'serif'].forEach(f => {
      test.style.fontFamily = f;
      defaultWidth[f] = test.offsetWidth;
    });
    const found = [];
    fonts.forEach(font => {
      let detected = false;
      ['monospace', 'sans-serif', 'serif'].forEach(baseFont => {
        test.style.fontFamily = font + ',' + baseFont;
        if (test.offsetWidth !== defaultWidth[baseFont]) detected = true;
      });
      if (detected) found.push(font);
    });
    document.body.removeChild(test);
    return hashString(found.join(','));
  } catch(e) { return 'f0'; }
}

async function getIP() {
  try {
    const controller = new AbortController();
    const t = setTimeout(() => controller.abort(), 2000);
    const r = await fetch('https://api.ipify.org?format=json', { signal: controller.signal });
    clearTimeout(t);
    const d = await r.json();
    return d.ip || '0';
  } catch(e) { return '0'; }
}

function getTelegramInfo() {
  try {
    const u = (tg.initDataUnsafe) || {};
    const platform = String(tg.platform || 'unknown');
    const version = String(tg.version || '');
    const hasUser = !!(u.user && u.user.id);
    return {
      platform: platform,
      version: version,
      hasUser: hasUser,
      userId: hasUser ? u.user.id : 0
    };
  } catch(e) {
    return { platform: 'unknown', version: '', hasUser: false, userId: 0 };
  }
}

async function collectFullFingerprint() {
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');

  try {
    status.textContent = 'Checking canvas...';
    bar.style.width = '12%';
    const canvas = getCanvasFP();
    await new Promise(r => setTimeout(r, 300));

    status.textContent = 'Checking GPU...';
    bar.style.width = '25%';
    const webgl = getWebGLFP();
    await new Promise(r => setTimeout(r, 300));

    status.textContent = 'Checking audio...';
    bar.style.width = '40%';
    const audio = await getAudioFP();
    await new Promise(r => setTimeout(r, 200));

    status.textContent = 'Checking fonts...';
    bar.style.width = '55%';
    const fonts = getFontsFP();
    await new Promise(r => setTimeout(r, 200));

    status.textContent = 'Checking network...';
    bar.style.width = '70%';
    const ip = await getIP();
    await new Promise(r => setTimeout(r, 200));

    status.textContent = 'Checking Telegram...';
    bar.style.width = '85%';
    const tgInfo = getTelegramInfo();
    await new Promise(r => setTimeout(r, 300));

    status.textContent = 'Building fingerprint...';
    bar.style.width = '95%';

    const screenStr = (screen.width || 0) + 'x' + (screen.height || 0) + 'x' + (screen.colorDepth || 24);
    let timezone = '';
    try { timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
    const cores = navigator.hardwareConcurrency || 0;
    const memory = navigator.deviceMemory || 0;
    const lang = navigator.language || '';
    const platform = navigator.platform || '';
    const touch = navigator.maxTouchPoints || 0;

    // Strong hardware-focused fingerprint
    const raw = [
      canvas, webgl, audio, fonts,
      screenStr, timezone, String(cores), String(memory),
      lang, platform, String(touch),
      tgInfo.platform, tgInfo.version
    ].join('|');

    const fpHash = 'hw_' + hashString(raw) + '_' + hashString(canvas + webgl + audio).slice(0, 8);

    status.textContent = 'Done!';
    bar.style.width = '100%';
    await new Promise(r => setTimeout(r, 400));

    // Send to bot
    tg.sendData(fpHash);
  } catch (err) {
    status.textContent = 'Error, sending basic fingerprint...';
    // Fallback simple fingerprint so it never gets stuck
    const fallback = 'hw_' + hashString(
      (screen.width||0) + 'x' + (screen.height||0) + '|' +
      (navigator.language||'') + '|' +
      (navigator.platform||'') + '|' +
      (navigator.hardwareConcurrency||0)
    );
    setTimeout(() => tg.sendData(fallback), 500);
  }
}

// Safety: force finish after 8 seconds no matter what
setTimeout(() => {
  const status = document.getElementById('status');
  if (status && status.textContent !== 'Done!') {
    status.textContent = 'Finishing...';
    const fallback = 'hw_' + hashString(
      Date.now() + '|' + (screen.width||0) + '|' + (navigator.language||'')
    );
    try { tg.sendData(fallback); } catch(e) {}
  }
}, 8000);

setTimeout(collectFullFingerprint, 600);
</script>
</body>
</html>
