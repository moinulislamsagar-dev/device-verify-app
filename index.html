<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.08);
    border-radius: 24px; padding: 28px 22px; max-width: 360px; width: 100%;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .icon { font-size: 48px; margin-bottom: 10px; }
  h2 { font-size: 19px; margin-bottom: 6px; }
  .sub { opacity: 0.72; font-size: 12.5px; line-height: 1.45; }
  .progress {
    width: 100%; height: 10px; background: rgba(255,255,255,0.12);
    border-radius: 20px; margin: 20px 0 10px; overflow: hidden;
  }
  .bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00f5a0, #00d9f5);
    border-radius: 20px; transition: width 0.35s ease;
  }
  .status { font-size: 12px; opacity: 0.75; min-height: 18px; }
  .steps { text-align: left; margin-top: 14px; font-size: 11px; opacity: 0.5; line-height: 1.65; }
  .debug { margin-top: 12px; font-size: 10px; opacity: 0.4; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>Hardware Security Check</h2>
  <p class="sub">Stable device lock (~8 sec). Same physical device = same ID. Real users are never blocked here.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Initializing...</div>
  <div class="steps" id="steps"></div>
  <div class="debug" id="debug"></div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

/* Deterministic hash - same input always same output */
function h(s) {
  let x = 2166136261;
  const str = String(s || '');
  for (let i = 0; i < str.length; i++) {
    x ^= str.charCodeAt(i);
    x = Math.imul(x, 16777619);
  }
  return (x >>> 0).toString(36);
}

function setStatus(t, p) {
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = p + '%';
}
function addStep(t) {
  document.getElementById('steps').innerHTML += '✓ ' + t + '<br>';
}

/* ---- STABLE hardware only (no random noise) ---- */

function stableCanvas() {
  try {
    const c = document.createElement('canvas');
    c.width = 200; c.height = 50;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#069';
    ctx.fillText('HWLOCK', 2, 2);
    ctx.fillStyle = '#f60';
    ctx.fillRect(80, 10, 50, 20);
    // toDataURL is stable for same ops on same GPU/browser
    return h(c.toDataURL().slice(-80));
  } catch (e) { return 'c0'; }
}

function stableWebGL() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'w0';
    const di = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor = di ? String(gl.getParameter(di.UNMASKED_VENDOR_WEBGL) || '') : '';
    const renderer = di ? String(gl.getParameter(di.UNMASKED_RENDERER_WEBGL) || '') : '';
    const ver = String(gl.getParameter(gl.VERSION) || '');
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 0;
    return h(vendor + '|' + renderer + '|' + ver + '|' + maxTex);
  } catch (e) { return 'w0'; }
}

function stableFonts() {
  try {
    const fonts = ['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact','Tahoma','Segoe UI'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    span.textContent = 'mmmmmmmmmmlli';
    document.body.appendChild(span);
    const base = {};
    ['monospace','sans-serif','serif'].forEach(function(f) {
      span.style.fontFamily = f;
      base[f] = span.offsetWidth;
    });
    const found = [];
    fonts.forEach(function(font) {
      let ok = false;
      ['monospace','sans-serif','serif'].forEach(function(b) {
        span.style.fontFamily = font + ',' + b;
        if (span.offsetWidth !== base[b]) ok = true;
      });
      if (ok) found.push(font);
    });
    document.body.removeChild(span);
    return h(found.join(','));
  } catch (e) { return 'f0'; }
}

function stableScreen() {
  return h([
    screen.width || 0,
    screen.height || 0,
    screen.colorDepth || 24,
    window.devicePixelRatio || 1,
    screen.availWidth || 0,
    screen.availHeight || 0
  ].join('x'));
}

function stableCPU() {
  return h([
    navigator.hardwareConcurrency || 0,
    navigator.deviceMemory || 0,
    navigator.maxTouchPoints || 0,
    navigator.platform || '',
    navigator.language || ''
  ].join('|'));
}

function stableTZ() {
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  return h(tz);
}

function stableTG() {
  try {
    const p = String(tg.platform || '');
    const v = String(tg.version || '');
    return h(p + '|' + v);
  } catch (e) { return 't0'; }
}

async function getIP() {
  try {
    const ctrl = new AbortController();
    setTimeout(function() { ctrl.abort(); }, 2500);
    const r = await fetch('https://api.ipify.org?format=json', { signal: ctrl.signal });
    const d = await r.json();
    return String(d.ip || '0');
  } catch (e) { return '0'; }
}

async function run() {
  const t0 = Date.now();
  try {
    setStatus('Canvas signature...', 10);
    await new Promise(function(r) { setTimeout(r, 700); });
    const canvas = stableCanvas();
    addStep('Canvas');

    setStatus('GPU / WebGL...', 22);
    await new Promise(function(r) { setTimeout(r, 700); });
    const webgl = stableWebGL();
    addStep('GPU');

    setStatus('Fonts...', 35);
    await new Promise(function(r) { setTimeout(r, 700); });
    const fonts = stableFonts();
    addStep('Fonts');

    setStatus('Screen...', 48);
    await new Promise(function(r) { setTimeout(r, 600); });
    const scr = stableScreen();
    addStep('Screen');

    setStatus('CPU / Memory...', 60);
    await new Promise(function(r) { setTimeout(r, 600); });
    const cpu = stableCPU();
    addStep('CPU');

    setStatus('Timezone + Telegram...', 72);
    await new Promise(function(r) { setTimeout(r, 600); });
    const tz = stableTZ();
    const tgs = stableTG();
    addStep('Client');

    setStatus('Network IP...', 84);
    await new Promise(function(r) { setTimeout(r, 500); });
    const ip = await getIP();
    addStep('IP');

    setStatus('Building device ID...', 92);
    await new Promise(function(r) { setTimeout(r, 400); });

    /*
      PRIMARY (must match same physical device every time):
        GPU + Screen + CPU + Fonts + Canvas + TZ + TG platform
      SECONDARY (IP):
        included so different networks add signal, but does NOT replace hardware
    */
    const primary = [webgl, scr, cpu, fonts, canvas, tz, tgs].join('||');
    const fp = 'hw_' + h(primary) + '_' + h(ip).slice(0, 8);

    const elapsed = Date.now() - t0;
    if (elapsed < 7800) {
      setStatus('Finalizing...', 96);
      await new Promise(function(r) { setTimeout(r, 7800 - elapsed); });
    }

    setStatus('Device locked!', 100);
    addStep('Done');
    document.getElementById('debug').textContent = fp.slice(0, 40) + '...';

    await new Promise(function(r) { setTimeout(r, 400); });

    // Send to bot - must use tg.sendData
    tg.sendData(fp);
  } catch (err) {
    setStatus('Completing...', 98);
    const fb = 'hw_' + h([
      String(screen.width || 0),
      String(screen.height || 0),
      String(navigator.hardwareConcurrency || 0),
      String(navigator.platform || ''),
      String(navigator.language || '')
    ].join('|'));
    setTimeout(function() {
      try { tg.sendData(fb); } catch (e) {}
    }, 300);
  }
}

setTimeout(function() {
  const st = document.getElementById('status');
  if (st && st.textContent.indexOf('locked') === -1) {
    try {
      tg.sendData('hw_' + h([
        String(screen.width || 0),
        String(screen.height || 0),
        String(navigator.hardwareConcurrency || 0),
        String(navigator.platform || '')
      ].join('|')));
    } catch (e) {}
  }
}, 12000);

setTimeout(run, 400);
</script>
</body>
</html>
