<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Security Check</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f0c29,#302b63,#24243e);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center}
  .card{background:rgba(255,255,255,.08);border-radius:24px;padding:28px 22px;max-width:360px;width:100%;border:1px solid rgba(255,255,255,.12)}
  .icon{font-size:48px;margin-bottom:10px}
  h2{font-size:19px;margin-bottom:6px}
  .sub{opacity:.72;font-size:12.5px;line-height:1.45}
  .progress{width:100%;height:10px;background:rgba(255,255,255,.12);border-radius:20px;margin:20px 0 10px;overflow:hidden}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,#00f5a0,#00d9f5);border-radius:20px;transition:width .4s ease}
  .status{font-size:12px;opacity:.75;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🛡️</div>
  <h2>Security Verification</h2>
  <p class="sub">Please wait while we verify your session. This may take a few seconds.</p>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Please wait...</div>
</div>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function h(s) {
  let x = 2166136261;
  s = String(s || '');
  for (let i = 0; i < s.length; i++) {
    x ^= s.charCodeAt(i);
    x = Math.imul(x, 16777619);
  }
  return (x >>> 0).toString(36);
}
function setStatus(t, p) {
  document.getElementById('status').textContent = t;
  document.getElementById('bar').style.width = p + '%';
}

function getWebGL() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return { raw: 'w0', vendor: '', renderer: '' };
    const di = gl.getExtension('WEBGL_debug_renderer_info');
    const vendor = di ? String(gl.getParameter(di.UNMASKED_VENDOR_WEBGL) || '') : '';
    const renderer = di ? String(gl.getParameter(di.UNMASKED_RENDERER_WEBGL) || '') : '';
    const version = String(gl.getParameter(gl.VERSION) || '');
    const shading = String(gl.getParameter(gl.SHADING_LANGUAGE_VERSION) || '');
    const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 0;
    const maxV = gl.getParameter(gl.MAX_VERTEX_ATTRIBS) || 0;
    const maxR = gl.getParameter(gl.MAX_RENDERBUFFER_SIZE) || 0;
    return {
      raw: vendor + '|' + renderer + '|' + version + '|' + shading + '|' + maxTex + '|' + maxV + '|' + maxR,
      vendor: vendor, renderer: renderer
    };
  } catch (e) {
    return { raw: 'w0', vendor: '', renderer: '' };
  }
}

function getCanvas() {
  try {
    const c = document.createElement('canvas');
    c.width = 240; c.height = 60;
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(10, 5, 100, 30);
    ctx.fillStyle = '#069';
    ctx.fillText('SEC-CHECK', 12, 12);
    ctx.fillStyle = 'rgba(50,200,50,0.7)';
    ctx.font = '11px Times New Roman';
    ctx.fillText('AaBbCc 012345', 12, 38);
    ctx.beginPath();
    ctx.arc(200, 30, 18, 0, Math.PI * 2);
    ctx.stroke();
    return c.toDataURL();
  } catch (e) { return 'c0'; }
}

function getFonts() {
  try {
    const list = ['Arial','Verdana','Times New Roman','Courier New','Georgia','Comic Sans MS','Impact','Tahoma','Segoe UI','Roboto','Helvetica Neue','Palatino'];
    const span = document.createElement('span');
    span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
    span.textContent = 'mmmmmmmmmmlliWw';
    document.body.appendChild(span);
    const base = {};
    ['monospace','sans-serif','serif'].forEach(function (f) {
      span.style.fontFamily = f;
      base[f] = span.offsetWidth;
    });
    const found = [];
    list.forEach(function (font) {
      let det = false;
      ['monospace','sans-serif','serif'].forEach(function (b) {
        span.style.fontFamily = "'" + font + "'," + b;
        if (span.offsetWidth !== base[b]) det = true;
      });
      if (det) found.push(font);
    });
    document.body.removeChild(span);
    return found.join(',');
  } catch (e) { return 'f0'; }
}

function getScreen() {
  return [screen.width||0,screen.height||0,screen.availWidth||0,screen.availHeight||0,screen.colorDepth||24,window.devicePixelRatio||1].join('x');
}

function getCPU() {
  return [
    navigator.hardwareConcurrency||0, navigator.deviceMemory||0, navigator.maxTouchPoints||0,
    navigator.platform||'', navigator.language||'', (navigator.languages||[]).slice(0,3).join(',')
  ].join('|');
}

function getTZ() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch (e) { return ''; }
}

function getTGUser() {
  try {
    const u = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : {};
    return {
      id: u.id ? String(u.id) : '',
      platform: String(tg.platform || ''),
      hasInit: !!(tg.initData && String(tg.initData).length > 20)
    };
  } catch (e) {
    return { id: '', platform: '', hasInit: false };
  }
}

function isEmulator(renderer, vendor) {
  const r = (renderer + ' ' + vendor).toLowerCase();
  const bad = ['swiftshader','llvmpipe','virtualbox','vmware','microsoft basic render','softgl','mesa offscreen','google swiftshader','android emulator','genymotion','bluestacks','nox'];
  for (let i = 0; i < bad.length; i++) {
    if (r.indexOf(bad[i]) !== -1) return true;
  }
  return false;
}

async function getNetInfo() {
  var ip = '0';
  var vpn = false;
  try {
    var ctrl = new AbortController();
    setTimeout(function () { ctrl.abort(); }, 4500);
    var r = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
    var d = await r.json();
    if (d && d.ip) ip = String(d.ip);
    // ipapi free may expose org/asn - treat hosting/datacenter keywords as VPN-like
    var org = String(d.org || d.asn || d.org_name || '').toLowerCase();
    var hostHints = ['hosting','cloud','amazon','digitalocean','ovh','hetzner','vultr','linode','google cloud','microsoft','azure','proxy','vpn','datacenter','colo'];
    for (var i = 0; i < hostHints.length; i++) {
      if (org.indexOf(hostHints[i]) !== -1) { vpn = true; break; }
    }
  } catch (e) {
    try {
      var r2 = await fetch('https://api.ipify.org?format=json');
      var d2 = await r2.json();
      if (d2 && d2.ip) ip = String(d2.ip);
    } catch (e2) {}
  }
  // Secondary VPN check
  if (!vpn && ip && ip !== '0') {
    try {
      var ctrl2 = new AbortController();
      setTimeout(function () { ctrl2.abort(); }, 3500);
      var r3 = await fetch('https://ipwho.is/' + encodeURIComponent(ip), { signal: ctrl2.signal });
      var d3 = await r3.json();
      if (d3 && d3.security) {
        if (d3.security.vpn || d3.security.proxy || d3.security.tor || d3.security.hosting) vpn = true;
      }
    } catch (e3) {}
  }
  return { ip: ip, vpn: vpn };
}

async function run() {
  var t0 = Date.now();
  try {
    setStatus('Please wait...', 8);
    await new Promise(function (r) { setTimeout(r, 900); });
    var webgl = getWebGL();

    if (isEmulator(webgl.renderer, webgl.vendor)) {
      setStatus('Verification failed.', 100);
      setTimeout(function () { tg.sendData('ban_emu'); }, 600);
      return;
    }

    setStatus('Please wait...', 20);
    await new Promise(function (r) { setTimeout(r, 900); });
    var canvas = getCanvas();

    setStatus('Please wait...', 32);
    await new Promise(function (r) { setTimeout(r, 850); });
    var fonts = getFonts();

    setStatus('Please wait...', 44);
    await new Promise(function (r) { setTimeout(r, 800); });
    var scr = getScreen();
    var cpu = getCPU();

    setStatus('Please wait...', 56);
    await new Promise(function (r) { setTimeout(r, 800); });
    var tgUser = getTGUser();
    if (!tgUser.id || !tgUser.hasInit) {
      setStatus('Verification failed.', 100);
      setTimeout(function () { tg.sendData('ban_client'); }, 600);
      return;
    }

    setStatus('Please wait...', 70);
    await new Promise(function (r) { setTimeout(r, 700); });
    var net = await getNetInfo();

    if (net.vpn) {
      setStatus('Verification failed.', 100);
      setTimeout(function () { tg.sendData('ban_vpn'); }, 600);
      return;
    }

    setStatus('Please wait...', 88);
    await new Promise(function (r) { setTimeout(r, 700); });

    var raw = [webgl.raw, h(canvas), fonts, scr, cpu, getTZ(), tgUser.platform].join('||');
    var fpHash = h(raw);
    var payload = 'hw_' + fpHash + '|uid=' + tgUser.id + '|ip=' + net.ip;

    var elapsed = Date.now() - t0;
    if (elapsed < 10000) {
      setStatus('Please wait...', 95);
      await new Promise(function (r) { setTimeout(r, 10000 - elapsed); });
    }

    setStatus('Done.', 100);
    await new Promise(function (r) { setTimeout(r, 500); });
    tg.sendData(payload);
  } catch (err) {
    setStatus('Please wait...', 98);
    var tgUser = getTGUser();
    var fb = 'hw_' + h(String(screen.width)+'x'+String(screen.height)) + '|uid=' + (tgUser.id||'0') + '|ip=0';
    setTimeout(function () { try { tg.sendData(fb); } catch (e) {} }, 400);
  }
}

setTimeout(function () {
  var st = document.getElementById('status');
  if (st && st.textContent.indexOf('Done') === -1 && st.textContent.indexOf('failed') === -1) {
    try {
      var tgUser = getTGUser();
      tg.sendData('hw_' + h(String(screen.width)+'x'+String(screen.height)) + '|uid=' + (tgUser.id||'0') + '|ip=0');
    } catch (e) {}
  }
}, 14000);

setTimeout(run, 500);
</script>
</body>
</html>
